<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Code I - Cliente</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="Cliente.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo">

            <div>
                <h1>Coffee Code I</h1>
                <p>Buen café, mejores ideas</p>
            </div>

        </div>

        <!-- MENÚ -->
        <nav class="menu">

            <button onclick="mostrarSeccion('productos')">
                Productos
            </button>

            <button onclick="mostrarSeccion('pedidos')">
                Mis pedidos
            </button>

        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- PRODUCTOS -->
        <section id="productos" class="seccion">

            <div class="titulo-seccion">

                <h2>Productos</h2>

                <p>
                    Elige tus productos favoritos
                </p>

            </div>

            <!--
                JavaScript mostrará aquí
                los productos por categoría.
            -->
            <div id="listaProductos"></div>

        </section>


        <!-- PEDIDO ACTUAL -->
        <section class="pedido">

            <div class="titulo-pedido">

                <h2>Mi pedido</h2>

                <span id="cantidadPedido">
                    0
                </span>

            </div>


            <!-- Productos seleccionados -->
            <div id="listaPedido" class="lista-pedido">

                <p class="pedido-vacio">
                    No hay productos en tu pedido.
                </p>

            </div>


            <!-- TOTAL -->
            <div class="total">

                <span>
                    Total:
                </span>

                <strong id="totalPedido">
                    $0.00
                </strong>

            </div>


            <!-- CREAR PEDIDO -->
            <button
                class="btn-pedido"
                onclick="crearPedido()">

                Crear pedido

            </button>

        </section>


        <!-- MIS PEDIDOS -->
        <section
            id="pedidos"
            class="seccion pedidos-seccion">

            <div class="titulo-seccion">

                <h2>Mis pedidos</h2>

                <p>
                    Consulta los pedidos que has realizado
                </p>

            </div>


            <!--
                JavaScript mostrará aquí
                los pedidos guardados.
            -->
            <div
                id="listaPedidos"
                class="lista-pedidos">

                <p class="pedidos-vacios">
                    Todavía no tienes pedidos.
                </p>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <div class="logo-footer">
            Coffee Code I
        </div>

        <p>
            Buen café, mejores ideas.
        </p>

    </footer>


    <!-- Conexión con JavaScript -->
    <script src="Cliente.js"></script>

</body>

</html>
