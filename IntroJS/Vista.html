
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conociendo JavaScript</title>
</head>
<body>

    <script>
        let nombre = prompt("¿Cual es tu nombre?")
        //Promt = Es una ventana emergente que surge para dedirle un dato al usuario 

        console.log("Hola: " + nombre + "!");
        // Console = Da acceso a la consola de depuracion del sistema. 
        //Console.log = Es la funicon principal para imprimir mensajes en esa consola.

        // Nota de Practica: Porque es importante la funcion de la consola al ejecutar dentro de inspeccionar. 

        document.write("<h1> Hola : " + nombre + " </h1>");
        //Document.write = Es una funcion que permite escribir en el documento HTML.

    </script>
    
</body>
</html>
